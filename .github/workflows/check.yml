name: check

# The verification gate. Required check on both `dev` and `main`.
#
# Triggers: pull requests into the integration branch, and pushes to it. Feature branches get
# their results here, which is what makes a PR mergeable, so this is the workflow that has to
# be trustworthy rather than the one that has to be fast.
on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev, main ]

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Build, test and verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # `contents: read` and nothing more. This job is a gate, and a gate that writes to the
    # repository cannot be a gate: see the ABI baseline recovery below.
    #
    # `pull-requests: write` is for exactly one thing — commenting on a pull request whose
    # ABI baseline needs re-recording. It is the narrowest permission that does the job.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - name: Apply the CI-only Gradle properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # The JDK that runs Gradle. Deliberately NOT a Gradle toolchain: this build has no
          # `jvmToolchain` anywhere, on purpose.
          #
          # A toolchain would be a second, independent JDK number. A Java compilation with no
          # explicit target falls back to the toolchain while Kotlin's jvmTarget comes from the
          # catalog, and the two disagreeing is the "inconsistent JVM-target compatibility"
          # failure. The catalog's jvmTarget is applied to both Java's and Kotlin's side, so
          # there is only ever one number.
          java-version: '21'

      # No wrapper JAR is committed (see README.md), so this is the action's documented
      # "project doesn't use Gradle wrapper" path: an explicit, quoted version, and the
      # `gradle` command below rather than a wrapper script.
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      # build-logic is a real build with real code. Verifying it is a separate, cheaper CI
      # gate that names build-logic as the culprit instead of blaming the module that merely
      # applied a broken convention plugin.
      - name: Verify the convention plugins themselves
        run: gradle -p build-logic :convention:check

      - name: Build, test, verify the module graph and the ABI
        id: verify
        run: gradle check verifyModuleGraph checkKotlinAbi

      # ABI validation compares against reference dumps under `*/api/`. A module with no
      # committed dump fails with "Expected file with ABI declarations ... does not exist" —
      # the guardrail working, on a project that has never recorded a baseline.
      #
      # This job used to fix that itself: regenerate the dumps and auto-commit them. It cannot,
      # and the reason is structural rather than a matter of permissions.
      #
      # A commit pushed with GITHUB_TOKEN does not start workflow runs. GitHub does create
      # `pull_request` runs for the new head — a push changes the PR's head, and the PR is the
      # trigger — but it holds every one of them in `action_required`, because they were caused
      # by a token-authored push. So the branch gains the dumps and the checks never run. The
      # pull request then reports an empty `statusCheckRollup` and sits BLOCKED with a red X
      # that no amount of pushing clears. It cost three round trips on one branch before the
      # shape of it was understood.
      #
      # A required check that mutates the repository is not a gate; it is a second actor racing
      # the first one. So the job regenerates, publishes, and reports, and the change lands as
      # an ordinary commit by an ordinary push, which is a commit a workflow will actually run.
      #
      # `failure() &&` is load-bearing throughout. GitHub implicitly conjoins an `if` with
      # `success()` unless the expression already contains a status function, so after the
      # verify step fails, a bare `steps.verify.outcome == 'failure'` is false and every
      # recovery step silently skips. The status function has to be stated.
      - name: Regenerate the ABI dumps
        if: failure() && steps.verify.outcome == 'failure'
        run: |
          echo "::notice::check failed; regenerating the reference ABI dumps to publish"
          # Delete first. `updateKotlinAbi` writes and overwrites but never removes, so a
          # dump belonging to a target that no longer exists survives every regeneration and
          # is then compared against a build that cannot produce it. That is exactly what
          # removing the Kotlin/Native target left behind.
          find . -path '*/api/*' -name '*.api' -delete
          gradle updateKotlinAbi

      - name: Publish the regenerated ABI dumps
        if: failure() && steps.verify.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: abi-baseline
          # `**`, not `*`. The artifact glob does not let a single star cross a
          # `/`, and the dumps live at engine/model/api/desktop/model.api, so `*/api/*`
          # would match engine/api and publish an empty artifact.
          path: '**/api/**'
          if-no-files-found: ignore
          retention-days: 30

      # A heredoc, not a printf with line continuations. The comment contains a fenced code
      # block with quotes, braces and a colon in it, and threading that through a shell
      # word list is how a body ends up subtly mangled. Nothing has to be escaped here.
      - name: Say on the pull request where the baseline is
        if: failure() && steps.verify.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then
            echo "not a pull request; the artifact is on the run and there is nothing to comment on"
            exit 0
          fi
          cat > "$RUNNER_TEMP/abi.md" <<'EOF'
          ### The ABI baseline needs re-recording

          `checkKotlinAbi` failed. This job will not commit the fix for you, and the reason is
          worth knowing. A commit pushed with `GITHUB_TOKEN` does not start workflow runs, so a
          self-healing step in a required check can only ever produce a branch holding the right
          files and a pull request whose checks never run. It fails closed, and it blocks itself.

          The regenerated dumps are attached to this run as **abi-baseline**. Download the
          artifact and commit them:

          ```
          unzip abi-baseline.zip -d .
          git add -- ':(glob)**/api/**'
          git commit -m "chore(build): record the reference ABI dumps"
          git push
          ```

          Or re-record them on a machine that has a toolchain:

          ```
          gradle updateKotlinAbi
          ```

          Either way the baseline lands as an ordinary push, which is a push a workflow actually
          runs.
          EOF
          # A fork has no write access here, so the comment is skipped rather than failed. The
          # artifact is published either way and stays downloadable from the run.
          gh pr comment "$PR" --body-file "$RUNNER_TEMP/abi.md" \
            || echo "could not comment on #$PR; the artifact is on the run"

      # `always()` so the Wasm canary runs even on a run where something else is already
      # red. A guardrail that is only proven on green runs is a guardrail that is never proven
      # while it matters — and this is the guardrail that catches a JVM type leaking into
      # commonMain, so a red run is exactly when it is worth running.
      #
      # The `if` is load-bearing and was missing. A bare `if` is conjoined with `success()` by
      # GitHub, so without it this step ran only when every earlier step had passed, and a
      # canary that only runs on a green build is not a canary.
      - name: Compile common tests for Wasm
        if: always()
        run: |
          gradle \
            :engine:model:compileTestKotlinWasmJs \
            :engine:schema:compileTestKotlinWasmJs \
            :engine:serialization:compileTestKotlinWasmJs \
            :engine:interpreter:compileTestKotlinWasmJs \
            :engine:analysis:compileTestKotlinWasmJs \
            :engine:editing:compileTestKotlinWasmJs \
            :engine:codegen:compileTestKotlinWasmJs \
            :engine:builtins:compileTestKotlinWasmJs

      # `always()` for the same reason as the Wasm canary above, and the same trap: without
      # an explicit status function this step is skipped on any already-red run, so the one
      # job that proves the module-graph checker can still *fail* would never run on a run
      # where that mattered.
      - name: Prove the graph checker rejects an illegal edge
        if: always()
        run: gradle selfTestModuleGraph

      # Gradle reports Kotlin compiler errors through the Problems API, and the step log
      # then carries only "Kotlin compiler error" with a file and a line. That is not
      # enough to act on: an internal compiler error in particular arrives with no message
      # at all. The report has the message, so it is uploaded whenever anything failed.
      - name: Upload the Gradle problems report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: problems-report
          path: '**/build/reports/problems/'
          if-no-files-found: ignore
          retention-days: 14
