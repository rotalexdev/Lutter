name: make-goldens

# Throwaway. There is no JDK on the maintainer's machine, so the codegen goldens have to be
# produced by a run and pulled back. Deleted once the goldens are committed.

on:
  push:
    branches: [ feat/codegen-golden-harness ]

permissions:
  contents: read

jobs:
  goldens:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Apply the CI-only Gradle properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - name: Write the codegen goldens
        run: gradle :integration:generated-compile:generateCodegenGoldens
      - name: Upload them
        uses: actions/upload-artifact@v4
        with:
          name: codegen-goldens
          path: 'integration/generated-compile/src/commonTest/resources/goldens/'
          if-no-files-found: error
          retention-days: 7
