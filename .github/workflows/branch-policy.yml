name: branch-policy

# Every branch that pull-requests into `dev` carries a semantic version.
#
# Why the rule is a required check rather than a convention: a branch name is the only place
# a version can be recorded before the work exists, and a rule nobody enforces is a rule
# that decays. `dev` is protected, so this job is what makes the policy real.
#
# The name format is  <type>/v<MAJOR>.<MINOR>.<PATCH>[-<prerelease>]  — a real semver
# version, optionally with a prerelease suffix, which is what makes `feat/v0.2.0-canaries`
# sort *below* `feat/v0.2.0` and above `feat/v0.1.9`.
#
# The lifecycle, enforced end to end:
#   1. `scripts/new-branch.sh <type> <version> <slug>` cuts a branch from dev
#   2. work happens there, never on dev or main
#   3. a pull request targets dev; this job checks the name
#   4. CI goes green, the PR merges, GitHub deletes the branch
#   5. step 1 again, with the next version
on:
  pull_request:
    branches: [ dev, main ]

permissions:
  contents: read

jobs:
  semver-branch:
    name: Branch name is semver
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate ${{ github.head_ref }}
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          pattern='^(feat|fix|chore|refactor|perf|docs|test|build|ci)/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9a-z.-]+)?$'

          if [[ "$BRANCH" =~ $pattern ]]; then
            echo "::notice::branch '$BRANCH' carries a semantic version"
            exit 0
          fi

          echo "::error title=Branch name must carry a semantic version::'$BRANCH' does not match <type>/v<MAJOR>.<MINOR>.<PATCH>[-<prerelease>]"
          echo ""
          echo "Valid types:      feat fix chore refactor perf docs test build ci"
          echo "Valid example:    feat/v0.1.0-foundation"
          echo "Prerelease:       feat/v0.2.0-canaries   (sorts below feat/v0.2.0)"
          echo ""
          echo "Cut the next branch with:"
          echo "  scripts/new-branch.sh feat 0.1.0 foundation"
          exit 1
