name: branch-policy

# Three rules, checked together because all three are about how a change is presented and
# none is discoverable from the code.
#
#   1. The branch carries only the conventional-commit TYPE: `feat/foundation`, `fix/node-repo`.
#      No version, no semver. A branch is a place to do one change, not a release record.
#      The trunk `dev` is exempt: as the head of the promotion PR of rule 3 it carries no
#      type by nature, and the promotion channel this workflow documents would otherwise
#      contradict itself.
#   2. The PULL REQUEST TITLE is a strict conventional commit:
#      `type(scope)!: description`.
#   3. Pull requests name `dev` as their base. `main` is the release shelf: its only
#      inhabitants are promoted `dev` states, so a PR that opens directly against `main`
#      would merge an entire topic branch's history — and every branch before it — into a
#      line whose history is supposed to stay the clean promotion of `dev`. PR #76 was
#      exactly this defect: a one-commit fixture branch whose PR base defaulted to the
#      repository's default branch, showing a 66-commit diff and one step away from
#      forking `main` from `dev`.
#
# The title is deliberately NOT required to match the branch name. `fix/node-distribution`
# opening `fix(build): declare the Node and Yarn distributions in settings` is correct and
# common: the branch says what area was touched, the title says what the change does.
#
# Why a required check rather than a convention: `dev` is protected, so this job is what
# makes either rule real instead of aspirational.
on:
  pull_request:
    branches: [ dev, main ]

permissions:
  contents: read

jobs:
  policy:
    name: Branch type and PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Branch name carries a conventional-commit type
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          # `dev` as the head is the promotion PR of rule 3 — the one PR whose base may be
          # `main`. A trunk name carries no type and the type rule names topic branches,
          # so rejecting it here would contradict this workflow's own promotion channel.
          if [[ "$BRANCH" == "dev" ]]; then
            echo "::notice::branch 'dev' is the promotion head; the type rule names topic branches"
            exit 0
          fi

          pattern='^(feat|fix|chore|refactor|perf|docs|test|build|ci|style|revert)/[a-z0-9][a-z0-9._-]*$'
          if [[ ! "$BRANCH" =~ $pattern ]]; then
            echo "::error title=Branch name must be <type>/<slug>::'$BRANCH' does not match"
            echo ""
            echo "Types:  feat fix chore refactor perf docs test build ci style revert"
            echo "Valid:  feat/foundation   fix/node-distribution   chore/ci-modernise"
            echo "Not:   feature/x   (not a type)   feat/Foundation   (not lowercase)"
            echo ""
            echo "Cut the next branch with:  scripts/new-branch.sh feat foundation"
            exit 1
          fi

          # A slug may not look like a version. A branch is a place to do one change, not a
          # release record, so `feat/v0.2.0-canaries` is rejected even though the type is
          # right. `v` followed by a digit is the shape that gives it away.
          if [[ "$BRANCH" =~ /v[0-9] ]]; then
            echo "::error title=Branch name must not carry a version::'$BRANCH' looks like a release branch"
            echo "A branch is one change. The version lives in the PR title, never in the branch name."
            echo "Valid:  feat/foundation      Invalid:  feat/v0.1.0-foundation"
            exit 1
          fi

          echo "::notice::branch '$BRANCH' is typed" 

      - name: PR title is a strict conventional commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          # type, optional (scope), optional !, then a description. Anchored, so anything
          # before or after the header is rejected rather than tolerated.
          pattern='^(feat|fix|chore|refactor|perf|docs|test|build|ci|style|revert)(\([a-z0-9._/-]+\))?(!)?: [a-z0-9].*$'

          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error title=PR title must be a conventional commit::'$TITLE' does not match"
            echo ""
            echo "Format:   <type>[(scope)][!]: <description>"
            echo "Types:    feat fix chore refactor perf docs test build ci style revert"
            echo "Valid:    feat(build): project foundation on the shared catalog"
            echo "Valid:    fix(build): declare the Node and Yarn distributions in settings"
            echo "Valid:    feat(runtime)!: drop the legacy renderer registry"
            echo "Invalid:  v0.1.0 - Phase 0: project foundation   (not a type)"
            echo "Invalid:  Update dependencies   (no type, no colon)"
            echo ""
            echo "The title does not have to match the branch name."
            exit 1
          fi

          if [[ ${#TITLE} -gt 100 ]]; then
            echo "::error title=PR title is too long::${#TITLE} characters, limit is 100"
            exit 1
          fi

          if [[ "$TITLE" == *. ]]; then
            echo "::error title=PR title must not end with a period::A conventional-commit description is a phrase, not a sentence."
            exit 1
          fi

          echo "::notice::'$TITLE' is a valid conventional commit"

      # `gh pr create` without an explicit `--base` defaults to the repository's DEFAULT
      # branch — which is `main` here — so a missing flag is enough to open a topic PR
      # against the release shelf. The head branch is what carries the change and nothing
      # else; basing a topic PR anywhere other than `dev` is the wrong target, not a
      # different flavour of the right one.
      #
      # `main` is not banned as a base outright: its gate is that the branch coming up to
      # it is `dev` itself, so a promotion PR (`dev` → `main`) still reaches this workflow
      # and passes.
      - name: Pull requests to main may only come from dev
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [[ "$BASE" == "main" && "$HEAD" != "dev" ]]; then
            echo "::error title=Pull requests to main may only come from dev::'$HEAD' opened against 'main'"
            echo ""
            echo "All PRs are delivered to 'dev'. 'main' is promoted from 'dev', so the only"
            echo "PR whose base is 'main' is the promotion of 'dev' itself."
            echo ""
            echo "Reopen this PR with its base set to dev:  gh pr edit --base dev"
            exit 1
          fi

          echo "::notice::base '$BASE' is correct for head '$HEAD'"
