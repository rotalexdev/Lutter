name: conformance

on:
  push:
  pull_request:

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Empty until Phase 4 introduces :engine:codegen. It exists from Phase 0 so the job, the
  # task path and the runner are proven while there is nothing to fail on: a CI job
  # discovered to be misconfigured on the day it first has real work is a job that reports a
  # false problem about the code under test.
  conformance:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # `packages` is set explicitly because the action's default is "tools platform-tools",
      # and cmdline-tools 16 no longer publishes a package called `tools`. The default makes
      # this step fail before the build starts, in every job, on every run.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.5.0'

      - name: Compile generated fixtures and compare them against the runtime
        run: gradle :integration:generated-compile:desktopTest
