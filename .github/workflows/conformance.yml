name: conformance

# PLAN §28.7: runtime and generated code must agree. Empty until Phase 4 introduces
# :engine:codegen. The job exists from Phase 0 so the job, the task path and the runner are
# proven while there is nothing to fail on: a CI job discovered to be misconfigured the day
# it first has real work is a job that reports a false problem about the code under test.
on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev, main ]

concurrency:
  group: conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conformance:
    name: Runtime versus generated code
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Apply the CI-only Gradle properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Compile generated fixtures and compare them against the runtime
        run: gradle :integration:generated-compile:desktopTest

      # `check` already explains why: the step log carries only
      # "java.lang.AssertionError at Assert.java:89" with no message, so a failure here was
      # undiagnosable without this. Uploaded unconditionally rather than only on failure, so
      # the evidence survives a flake that passed on the rerun.
      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/test-results/**/*.xml'
          if-no-files-found: ignore
          retention-days: 14
