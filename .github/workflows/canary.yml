name: canary

# PLAN §21.1 canary targets: the eight *pure* engine modules are compiled, and their tests
# run, for iOS and Wasm even though neither is published yet.
#
# The point is not coverage. It is that a `java.io` import in `:engine:analysis` is caught by
# CI on day one instead of surfacing the day iOS support is announced. Compose modules are
# excluded: they legitimately pull in platform-backed Compose artifacts, so a canary there
# would be testing the dependency rather than the boundary.
on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev, main ]

concurrency:
  group: canary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  canary-ios:
    name: iOS simulator (pure modules)
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Apply the CI-only Gradle properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Configuring the build still evaluates the Android target on every module, so the SDK
      # has to be here even on a job that only compiles Apple targets.
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install the Android platform the build configures against
        run: sdkmanager "platforms;android-37"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Run and compile common tests for the iOS simulator
        run: |
          gradle \
            :engine:model:iosSimulatorArm64Test \
            :engine:schema:iosSimulatorArm64Test \
            :engine:serialization:iosSimulatorArm64Test \
            :engine:interpreter:iosSimulatorArm64Test \
            :engine:analysis:iosSimulatorArm64Test \
            :engine:editing:iosSimulatorArm64Test \
            :engine:codegen:iosSimulatorArm64Test \
            :engine:builtins:iosSimulatorArm64Test

  canary-wasm:
    name: Wasm compile (pure modules)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Apply the CI-only Gradle properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install the Android platform the build configures against
        run: sdkmanager "platforms;android-37"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      # Compile only, no wasmJsBrowserTest. Executing browser tests needs a headless Chrome
      # this repository does not provision, and provisioning one is a decision about the
      # runner rather than about the engine. Compiling is still the meaningful guard: the
      # Kotlin/Native and Kotlin/Wasm compilers reject JVM types in commonMain, so a `java.`
      # import fails here even though no test ever runs. When browser execution is wanted,
      # the honest fix is a provisioned Chrome in this job, not a weaker check.
      - name: Compile common tests for wasmJs
        run: |
          gradle \
            :engine:model:compileTestKotlinWasmJs \
            :engine:schema:compileTestKotlinWasmJs \
            :engine:serialization:compileTestKotlinWasmJs \
            :engine:interpreter:compileTestKotlinWasmJs \
            :engine:analysis:compileTestKotlinWasmJs \
            :engine:editing:compileTestKotlinWasmJs \
            :engine:codegen:compileTestKotlinWasmJs \
            :engine:builtins:compileTestKotlinWasmJs
