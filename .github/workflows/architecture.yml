name: architecture

# PLAN §23.4 Konsist rules. Deliberately NOT a required check.
#
# Konsist parses sources with an IntelliJ PSI layer whose last release predates the Kotlin
# version in the shared catalog. It is the least trustworthy component in this build, and a
# rule engine that may not parse the language should not be able to hold the pipeline
# hostage. If it proves unusable, this job is replaced by Detekt rather than blocking the
# work.
on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev, main ]

concurrency:
  group: architecture-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  architecture:
    name: Konsist architecture rules
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Apply the CI-only Gradle properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - run: gradle :tools:architecture-tests:test
