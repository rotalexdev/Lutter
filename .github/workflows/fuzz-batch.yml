name: fuzz-batch

# PLAN §28.5 / §36: a batch of random valid documents, compiled for real.
#
# Not a required check and not a gate. What it answers is a question `conformance` cannot: its
# eleven documents were all chosen by somebody, so a defect that only one generated document in two
# hundred has is invisible to it. This generates them.
#
# Three triggers, each with its own job. `push` to dev is the primary detector: it fires on
# every merge rather than once a night, so a defect lands on the integration line sooner than
# any nightly could catch it. `schedule` exists because PLAN §36 names the nightly batch
# literally, and since the MVP release merge (PR #117) the default branch carries these
# workflows — a scheduled event now fires from `main`, the way GitHub always intended a
# schedule to work. `workflow_dispatch` answers the manual run; before the release it
# answered HTTP 404 under the same default-branch restriction `schedule` had, and it is
# written down here so the next reader does not spend an afternoon finding that out again.
on:
  push:
    branches: [ dev ]
  schedule:
    # 03:00 UTC nightly, over the promoted default branch.
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: fuzz-batch-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz batch of generated documents
    runs-on: ubuntu-latest
    # Measured, not guessed: the batch itself is 693 ms for two hundred documents and the whole
    # job is 142 s cold on a GitHub runner, so conformance's 45 is not the right comparison and
    # thirty is ample. The step below still echoes its elapsed time, because a runner slow enough
    # to reach thirty is a fact worth reading rather than a fact worth timing out on.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Apply the CI-only Gradle properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      # `compileKotlinDesktop` and not `desktopTest`: the UI tests pull Compose's test API and
      # Skiko's native library, so a render failing on a headless runner would be indistinguishable
      # from a compile failing. The claim is that the code compiles, and only a compile asserts it.
      #
      # The count is echoed with the seed range and the elapsed time on both the passing and the
      # failing path, because a job that reports nothing about its own size is a job whose budget
      # nobody can retune.
      #
      # The batch fails at 41 of 200 and that is the report, not a broken gate: `m3.TextField`
      # declares an event its binding cannot receive, `m3.Button` declares one it has no handler
      # for, and the printer refuses six `Value` variants it does not spell yet. All three are
      # gaps in `:engine:codegen` and all three predate this job. The count stays green when the
      # codegen gap closes and not one commit sooner.
      #
      # `if` rather than a bare command because GitHub runs bash with `-e`: a failing `gradle`
      # would abort the step and the echo below would never print, which is the one line this job
      # exists to produce.
      - name: Generate and compile the fuzz batch
        run: |
          count=200
          start=$(date +%s)
          if gradle -Pforge.fuzzBatch=true -Pforge.fuzzCount="$count" :integration:generated-compile:compileKotlinDesktop; then status=0; else status=$?; fi
          echo "fuzz batch: documents=$count seeds=1-$count elapsed=$(( $(date +%s) - start ))s"
          exit $status

      # Nothing here runs a test, so this upload is usually empty and `if-no-files-found: ignore`
      # is what keeps it that way rather than a red run over a directory nobody created. It is
      # here for the shape every other workflow in this repository shares.
      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/test-results/**/*.xml'
          if-no-files-found: ignore
          retention-days: 14

      # A compile failure names the generated file and line, and without the file the finding is
      # unreadable from the run's log alone — the batch deletes nothing but the workspace goes
      # with the runner, so this holds the generated tree for the failing path. Every other use
      # of it stays manual: it is an artifact of a failure, not a golden material.
      - name: Upload the generated sources on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: generated-sources
          path: integration/generated-compile/build/generated/
          if-no-files-found: ignore
          retention-days: 7