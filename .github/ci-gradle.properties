# Properties that apply to CI only.
#
# The `Copy CI gradle.properties` step in every workflow copies this over
# ~/.gradle/gradle.properties. Gradle does NOT read this file instead of the project's
# gradle.properties — it merges the two and resolves each key by source precedence, with
# GRADLE_USER_HOME winning over the project directory. So a key set in both files takes this
# file's value, and a key set only in the project file is still read. That is what makes this
# a usable override rather than a replacement: it changes the settings it mentions and leaves
# the rest of the project's personality intact.
#
# Same pattern nowinandroid uses, and the same reason.
#
# Consequence worth knowing: a property the project file sets to `false` is NOT neutralised
# by CI unless this file says otherwise. `forge.warningsAsErrors` below is exactly such a
# key, and that line was previously a comment claiming CI passed it as a -P flag, which
# nothing did.

# `forge.warningsAsErrors` is NOT set here, and the comment in the project's gradle.properties
# claiming CI passed it as a -P flag was a lie: nothing passed it, for its whole life. That
# comment is now corrected to say the flag is off, which is the true state.
#
# Turning it on is not yet possible, and the reason is worth recording because it is not a
# matter of turning it on:
#
#   -Werror is specified and works. It found two real defects on its first run - a missing
#   @OptIn for @JsonClassDiscriminator, which is @ExperimentalSerializationApi. Both are fixed.
#
# It also found two warnings this repository cannot remove:
#
#   The argument '-Xcontext-parameters' is redundant for the current language version 2.4.
#   The argument '-Xexplicit-backing-fields' is redundant for the current language version 2.4.
#
# Those flags are not passed anywhere in this build. `engine/model`, where they were reported,
# applies no Compose plugin; the convention plugin adds only `-Werror`. So the Kotlin 2.4
# toolchain is injecting them, and it then warns that they are redundant. A compiler-argument
# warning has no @Suppress and no per-source opt-out, so -Werror can never be green while it
# is emitted, and the guardrail would be a permanent red build rather than a guardrail.
#
# Enabling it therefore waits on one thing: find who passes those two flags and stop, or pin
# whatever makes the toolchain add them. Everything else is ready. The failing opt-in warnings
# were worth the experiment on their own.

# One-shot JVM per invocation. The daemon exists to make an interactive loop fast; a CI job
# runs a handful of Gradle commands and exits, so the daemon is pure start-up cost.
org.gradle.daemon=false

org.gradle.parallel=true
# Three workers, not the runner's full core count: Gradle's own workers and the Kotlin
# compiler daemon already compete for the same CPUs, and oversubscribing them makes a
# medium build slower than an honestly parallel one.
org.gradle.workers.max=3

org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

# Any configuration-cache problem is a build failure, not a log line. A silently degraded
# configuration cache is the failure mode that costs the most and is noticed the least.
org.gradle.configuration-cache.problems=fail

kotlin.incremental=false

# Kotlin's incremental compiler keeps a shared build state that is only worth it across
# repeated local invocations, and it is a common source of non-reproducible CI behaviour.
