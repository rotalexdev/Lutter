# Robolectric's runtime for this module's host tests.
#
# 35, not the 37 this module targets: Robolectric 4.17 ships up to 36, and 36's
# `ApplicationSharedMemory` pokes `FileDescriptor` internals through reflection, which a JDK 21
# runtime refuses without `--add-opens`. NowInAndroid pins 35 in both of its modules for the same
# reason — this is its file, not a guess.
sdk = 35
