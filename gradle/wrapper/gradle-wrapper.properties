# Pinned so the Gradle version is reviewable in a diff.
#
# There is deliberately no gradle-wrapper.jar next to this file: this workspace is not
# allowed to download Gradle binaries, and a JAR is exactly that. CI installs Gradle with
# `gradle/actions/setup-gradle` and an explicit `gradle-version: '9.5.0'` input, which is
# the action's documented path for projects that do not carry a wrapper. See README.md.
distributionUrl=https\://services.gradle.org/distributions/gradle-9.5.0-bin.zip
networkTimeout=10000
validateDistributionUrl=true
