# No local toolchain is permitted in this workspace. Gradle, Kotlin, the JDK and the
# Android SDK are provisioned exclusively by GitHub Actions, so nothing here may be
# validated by running a build. The properties below are therefore written to be read by
# CI, not by a developer loop.
#
# Consequences of the policy, repeated from README.md because a build file is where
# someone reaches for a tool:
#   * `gradle` / `./gradlew` / `kotlinc` / `java` must never be invoked here.
#   * `gradle/wrapper/gradle-wrapper.jar` is intentionally absent; only the properties
#     file pinning the version is committed.
#   * Every check in this repository is CI-PENDING until a CI run reports it. Do not
#     report a build, test or ABI result that was not actually observed.

# Metaspace is capped separately from the heap: without it a long configuration-cache
# warm-up can grow Metaspace until the container is killed rather than failing cleanly.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Full warning visibility. CI turns warnings into errors, so a warning that only shows up
# on a developer machine is a warning that would have failed the pipeline instead.
org.gradle.warning.mode=all

# Off by default so a contributor without the -P flag is not blocked by deprecation
# warnings in dependencies they cannot change. CI passes -Pforge.warningsAsErrors=true,
# which appends -Werror to the Kotlin compiler arguments of every module.
forge.warningsAsErrors=false

kotlin.code.style=official
# Not a build-quality setting: this build is not a published Kotlin library, so the
# "KMP is still incubating" warning on every invocation is pure noise.
kotlin.mpp.stability.nowarn=true

android.useAndroidX=true
# Modules must not see each other's R classes; a leaked R reference is how an Android
# resource dependency sneaks past the module graph checker.
android.nonTransitiveRClass=true
